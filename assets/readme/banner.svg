<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="kkTitle">
  <title id="kkTitle">KasKelas — Sistem Informasi Manajemen Kas Kelas</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142a4d"/>
      <stop offset="0.5" stop-color="#1b3560"/>
      <stop offset="1" stop-color="#203b65"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.16" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#3268d8" stop-opacity="0.60"/>
      <stop offset="1" stop-color="#3268d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0.95" cy="1" r="0.72">
      <stop offset="0" stop-color="#15966a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#15966a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#dea32a"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f9bf5"/>
      <stop offset="1" stop-color="#3268d8"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ec08c"/>
      <stop offset="1" stop-color="#15966a"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#ffffff" fill-opacity="0.055"/>
    </pattern>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="220%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#081225" flood-opacity="0.5"/>
    </filter>
    <clipPath id="round"><rect x="0" y="0" width="1200" height="340" rx="26"/></clipPath>

    <style>
      .ff { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 3.2px; fill: #8fb0ee; }
      .word    { font-size: 76px; font-weight: 800; letter-spacing: -2.5px; fill: #ffffff; }
      .tag     { font-size: 21px; font-weight: 600; fill: #c9d8f5; }
      .pill    { font-size: 14px; font-weight: 600; fill: #dbe6fb; }
      .cardTitle { font-size: 15px; font-weight: 700; fill: #172b4d; }
      .cardSub   { font-size: 11px; font-weight: 500; fill: #8592a8; }
      .axis      { font-size: 10px; font-weight: 500; fill: #8592a8; }
      .coinTxt   { font-size: 15px; font-weight: 800; fill: #8a5f0a; }

      .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 2.8s cubic-bezier(.4,0,.2,1) infinite alternate; }
      .b2 { animation-delay: .25s; } .b3 { animation-delay: .50s; } .b4 { animation-delay: .15s; }
      .b5 { animation-delay: .40s; } .b6 { animation-delay: .65s; }

      .floaty { animation: floaty 4.2s ease-in-out infinite; }
      .f2 { animation-duration: 5.1s; animation-delay: .6s; }
      .f3 { animation-duration: 3.6s; animation-delay: .3s; }
      .glow { animation: pulse 7s ease-in-out infinite; }

      @keyframes grow   { from { transform: scaleY(.30); } to { transform: scaleY(1); } }
      @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      @keyframes pulse  { 0%,100% { opacity: .62; } 50% { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .bar, .floaty, .glow { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <rect class="glow" width="1200" height="340" fill="url(#glowBlue)"/>
    <rect class="glow" width="1200" height="340" fill="url(#glowGreen)"/>
  </g>

  <text class="ff eyebrow" x="72" y="96">PROJECT BASED LEARNING · KELOMPOK 7</text>
  <text class="ff word" x="68" y="178">KasKelas</text>
  <text class="ff tag" x="72" y="214">Sistem Informasi Manajemen Kas Kelas</text>

  <g class="ff pill">
    <rect x="72" y="248" width="74" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="109" y="273" text-anchor="middle">PHP</text>
    <rect x="158" y="248" width="182" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="249" y="273" text-anchor="middle">Role-based Access</text>
    <rect x="352" y="248" width="150" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="427" y="273" text-anchor="middle">Manajemen Kas</text>
  </g>

  <g transform="translate(744,54)" filter="url(#cardShadow)">
    <rect width="384" height="232" rx="22" fill="#ffffff"/>
    <circle cx="48" cy="38" r="16" fill="#edf3ff"/>
    <text class="ff" x="48" y="44" text-anchor="middle" font-size="16" font-weight="800" fill="#3268d8">K</text>
    <text class="ff cardTitle" x="76" y="34">Ringkasan Kas</text>
    <text class="ff cardSub" x="76" y="52">Periode bulan ini</text>
    <line x1="32" y1="72" x2="352" y2="72" stroke="#eef1f6" stroke-width="1.5"/>

    <line x1="32" y1="204" x2="352" y2="204" stroke="#e7ebf2" stroke-width="1.5"/>
    <g>
      <rect class="bar"    x="32"  y="144" width="34" height="60"  rx="8" fill="url(#barBlue)"/>
      <rect class="bar b2" x="89"  y="116" width="34" height="88"  rx="8" fill="url(#barBlue)"/>
      <rect class="bar b3" x="146" y="134" width="34" height="70"  rx="8" fill="url(#barBlue)"/>
      <rect class="bar b4" x="203" y="96"  width="34" height="108" rx="8" fill="url(#barBlue)"/>
      <rect class="bar b5" x="260" y="122" width="34" height="82"  rx="8" fill="url(#barBlue)"/>
      <rect class="bar b6" x="317" y="86"  width="34" height="118" rx="8" fill="url(#barGreen)"/>
    </g>
    <g class="ff axis" text-anchor="middle">
      <text x="49" y="222">Jul</text>
      <text x="106" y="222">Ags</text>
      <text x="163" y="222">Sep</text>
      <text x="220" y="222">Okt</text>
      <text x="277" y="222">Nov</text>
      <text x="334" y="222">Des</text>
    </g>
  </g>

  <g transform="translate(712,236)">
    <g class="floaty">
      <circle r="22" fill="url(#coin)"/>
      <circle r="22" fill="none" stroke="#b57f14" stroke-opacity="0.45" stroke-width="2"/>
      <circle r="15" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
      <text class="ff coinTxt" x="0" y="6" text-anchor="middle">Rp</text>
    </g>
  </g>
  <g transform="translate(1150,92)">
    <g class="floaty f2">
      <circle r="16" fill="url(#coin)"/>
      <circle r="16" fill="none" stroke="#b57f14" stroke-opacity="0.45" stroke-width="1.6"/>
      <text class="ff coinTxt" x="0" y="5" text-anchor="middle" font-size="12">Rp</text>
    </g>
  </g>
  <g transform="translate(1146,246)">
    <g class="floaty f3">
      <circle r="13" fill="url(#coin)"/>
      <circle r="13" fill="none" stroke="#b57f14" stroke-opacity="0.45" stroke-width="1.4"/>
    </g>
  </g>
</svg>
