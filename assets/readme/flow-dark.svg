<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="flowTitleD">
  <title id="flowTitleD">Alur sistem KasKelas: login, validasi peran, lalu panel kerja sesuai hak akses</title>

  <defs>
    <style>
      .ff { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 19px; font-weight: 700; fill: #e8eefb; }
      .caption { font-size: 13px; font-weight: 500; fill: #8a99b5; }
      .pillTxt { font-size: 16px; font-weight: 700; fill: #ffffff; }
      .roleName { font-size: 14px; font-weight: 700; }
      .roleMeta { font-size: 11px; font-weight: 500; fill: #8a99b5; }
      .rowTxt { font-size: 13px; font-weight: 500; fill: #c2cee4; }
      .link { stroke: #2b3f63; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .arrow { fill: #2b3f63; }
    </style>
    <clipPath id="cardClip"><rect x="0" y="0" width="300" height="252" rx="16"/></clipPath>
  </defs>

  <text class="ff title" x="600" y="44" text-anchor="middle">Login → Validasi Peran → Panel Kerja Sesuai Hak Akses</text>

  <rect x="490" y="66" width="220" height="54" rx="27" fill="#3268d8"/>
  <text class="ff pillTxt" x="600" y="100" text-anchor="middle">Masuk / Login</text>

  <path class="link" d="M600 120 V152"/>
  <path class="link" d="M210 152 H990"/>
  <path class="link" d="M210 152 V166"/>
  <path class="link" d="M600 152 V166"/>
  <path class="link" d="M990 152 V166"/>
  <polygon class="arrow" points="210,178 201,163 219,163"/>
  <polygon class="arrow" points="600,178 591,163 609,163"/>
  <polygon class="arrow" points="990,178 981,163 999,163"/>

  <g transform="translate(60,178)">
    <rect width="300" height="252" rx="16" fill="#16233a" stroke="#263a5c" stroke-width="1.5"/>
    <g clip-path="url(#cardClip)">
      <rect width="300" height="46" fill="#1a2c4d"/>
    </g>
    <circle cx="26" cy="23" r="6" fill="#5b8bf0"/>
    <text class="ff roleName" x="42" y="28" fill="#8fb0ee">Admin / Pengelola</text>
    <text class="ff roleMeta" x="274" y="28" text-anchor="end">5 menu</text>
    <circle cx="26" cy="75" r="4" fill="#5b8bf0" fill-opacity="0.9"/>
    <text class="ff rowTxt" x="42" y="80">Dashboard</text>
    <circle cx="26" cy="109" r="4" fill="#5b8bf0" fill-opacity="0.9"/>
    <text class="ff rowTxt" x="42" y="114">Kelola Grup</text>
    <circle cx="26" cy="143" r="4" fill="#5b8bf0" fill-opacity="0.9"/>
    <text class="ff rowTxt" x="42" y="148">Kelola Anggota</text>
    <circle cx="26" cy="177" r="4" fill="#5b8bf0" fill-opacity="0.9"/>
    <text class="ff rowTxt" x="42" y="182">Pengeluaran</text>
    <circle cx="26" cy="211" r="4" fill="#5b8bf0" fill-opacity="0.9"/>
    <text class="ff rowTxt" x="42" y="216">Laporan</text>
  </g>

  <g transform="translate(450,178)">
    <rect width="300" height="252" rx="16" fill="#16233a" stroke="#263a5c" stroke-width="1.5"/>
    <g clip-path="url(#cardClip)">
      <rect width="300" height="46" fill="#12352b"/>
    </g>
    <circle cx="26" cy="23" r="6" fill="#3ec08c"/>
    <text class="ff roleName" x="42" y="28" fill="#5fd3a6">Bendahara</text>
    <text class="ff roleMeta" x="274" y="28" text-anchor="end">5 menu</text>
    <circle cx="26" cy="75" r="4" fill="#3ec08c" fill-opacity="0.9"/>
    <text class="ff rowTxt" x="42" y="80">Dashboard</text>
    <circle cx="26" cy="109" r="4" fill="#3ec08c" fill-opacity="0.9"/>
    <text class="ff rowTxt" x="42" y="114">Tagihan</text>
    <circle cx="26" cy="143" r="4" fill="#3ec08c" fill-opacity="0.9"/>
    <text class="ff rowTxt" x="42" y="148">Verifikasi Pembayaran</text>
    <circle cx="26" cy="177" r="4" fill="#3ec08c" fill-opacity="0.9"/>
    <text class="ff rowTxt" x="42" y="182">Pengeluaran</text>
    <circle cx="26" cy="211" r="4" fill="#3ec08c" fill-opacity="0.9"/>
    <text class="ff rowTxt" x="42" y="216">Laporan</text>
  </g>

  <g transform="translate(840,178)">
    <rect width="300" height="252" rx="16" fill="#16233a" stroke="#263a5c" stroke-width="1.5"/>
    <g clip-path="url(#cardClip)">
      <rect width="300" height="46" fill="#38290f"/>
    </g>
    <circle cx="26" cy="23" r="6" fill="#e0a359"/>
    <text class="ff roleName" x="42" y="28" fill="#e8b978">Anggota</text>
    <text class="ff roleMeta" x="274" y="28" text-anchor="end">4 menu</text>
    <circle cx="26" cy="75" r="4" fill="#e0a359" fill-opacity="0.9"/>
    <text class="ff rowTxt" x="42" y="80">Dashboard</text>
    <circle cx="26" cy="109" r="4" fill="#e0a359" fill-opacity="0.9"/>
    <text class="ff rowTxt" x="42" y="114">Informasi Grup</text>
    <circle cx="26" cy="143" r="4" fill="#e0a359" fill-opacity="0.9"/>
    <text class="ff rowTxt" x="42" y="148">Kewajiban / Tagihan</text>
    <circle cx="26" cy="177" r="4" fill="#e0a359" fill-opacity="0.9"/>
    <text class="ff rowTxt" x="42" y="182">Pembayaran</text>
  </g>

  <text class="ff caption" x="600" y="456" text-anchor="middle">Setiap peran masuk ke panel yang sama, tetapi menu dan aksi yang tampil dibatasi oleh hak akses.</text>
</svg>
