<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 215" width="1200" height="215" role="img" aria-labelledby="roadmapTitleL">
  <title id="roadmapTitleL">Roadmap KasKelas — 4 dari 9 tahap selesai</title>

  <defs>
    <style>
      .ff { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 800; fill: #172b4d; letter-spacing: -0.4px; }
      .sub   { font-size: 13px; font-weight: 600; fill: #778399; }
      .lbl   { font-size: 11.5px; font-weight: 600; letter-spacing: 0.1px; }
      .done  { fill: #0f7a55; }
      .todo  { fill: #64708a; }
      .num   { font-size: 12px; font-weight: 700; fill: #8592a8; }

      .track { stroke: #e7ebf2; stroke-width: 3; stroke-linecap: round; }
      .fill  { stroke: #15966a; stroke-width: 3.5; stroke-linecap: round;
               stroke-dasharray: 360; stroke-dashoffset: 360;
               animation: draw 1.1s cubic-bezier(.4,0,.2,1) .15s forwards; }

      .pop { opacity: 0; transform-box: fill-box; transform-origin: center;
             animation: pop .55s cubic-bezier(.2,.85,.25,1) forwards; }
      .d0 { animation-delay: .10s; } .d1 { animation-delay: .24s; }
      .d2 { animation-delay: .38s; } .d3 { animation-delay: .52s; }
      .d4 { animation-delay: .70s; } .d5 { animation-delay: .82s; }
      .d6 { animation-delay: .94s; } .d7 { animation-delay: 1.06s; }
      .d8 { animation-delay: 1.18s; }

      .ring { transform-box: fill-box; transform-origin: center;
              animation: ring 2.4s ease-in-out infinite; }
      .fade { opacity: 0; animation: fade .6s ease forwards; }
      .lbl0 { animation-delay: .2s; } .lbl1 { animation-delay: .34s; }
      .lbl2 { animation-delay: .48s; } .lbl3 { animation-delay: .62s; }
      .lbl4 { animation-delay: .80s; } .lbl5 { animation-delay: .92s; }
      .lbl6 { animation-delay: 1.04s; } .lbl7 { animation-delay: 1.16s; }
      .lbl8 { animation-delay: 1.28s; }
      .lblA { animation-delay: .25s; }

      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes pop  { from { opacity: 0; transform: translateY(10px) scale(.6); }
                        to   { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes fade { to { opacity: 1; } }
      @keyframes ring { 0%, 100% { opacity: .40; transform: scale(1); }
                        50%      { opacity: 0;   transform: scale(1.85); } }

      @media (prefers-reduced-motion: reduce) {
        .fill, .pop, .ring, .fade { animation: none; }
        .pop, .fade { opacity: 1; }
        .fill { stroke-dashoffset: 0; }
        .ring { display: none; }
      }
    </style>
  </defs>

  <text class="ff title" x="60" y="42">Roadmap Pengembangan</text>
  <text class="ff sub" x="60" y="68">4 dari 9 tahap selesai — <tspan fill="#15966a">fase fondasi selesai</tspan>, backend &amp; data menyusul.</text>

  <line class="track" x1="120" y1="132" x2="1080" y2="132"/>
  <line class="fill"  x1="120" y1="132" x2="480"  y2="132"/>

  <g transform="translate(120,132)">
    <g class="pop d0">
      <circle r="13" fill="#15966a"/>
      <path d="M-5.5 0 L-1.6 3.8 L5.8 -4.2" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text class="ff lbl done fade lbl0" x="120" y="176" text-anchor="middle">Struktur</text>
  <text class="ff lbl done fade lbl0" x="120" y="193" text-anchor="middle">Halaman</text>

  <g transform="translate(240,132)">
    <g class="pop d1">
      <circle r="13" fill="#15966a"/>
      <path d="M-5.5 0 L-1.6 3.8 L5.8 -4.2" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text class="ff lbl done fade lbl1" x="240" y="176" text-anchor="middle">Layout &amp;</text>
  <text class="ff lbl done fade lbl1" x="240" y="193" text-anchor="middle">Sidebar</text>

  <g transform="translate(360,132)">
    <g class="pop d2">
      <circle r="13" fill="#15966a"/>
      <path d="M-5.5 0 L-1.6 3.8 L5.8 -4.2" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text class="ff lbl done fade lbl2" x="360" y="176" text-anchor="middle">Login +</text>
  <text class="ff lbl done fade lbl2" x="360" y="193" text-anchor="middle">Demo Role</text>

  <g transform="translate(480,132)">
    <g class="pop d3">
      <circle r="13" fill="#15966a"/>
      <path d="M-5.5 0 L-1.6 3.8 L5.8 -4.2" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text class="ff lbl done fade lbl3" x="480" y="186" text-anchor="middle">Design Token</text>

  <g transform="translate(600,132)">
    <circle class="ring" r="13" fill="none" stroke="#3268d8" stroke-width="2"/>
    <g class="pop d4">
      <circle r="13" fill="#ffffff" stroke="#cdd8ea" stroke-width="2"/>
      <text class="ff num" x="0" y="4" text-anchor="middle">5</text>
    </g>
  </g>
  <text class="ff lbl todo fade lbl4" x="600" y="176" text-anchor="middle">Autentikasi</text>
  <text class="ff lbl todo fade lbl4" x="600" y="193" text-anchor="middle">Backend</text>

  <g transform="translate(720,132)">
    <g class="pop d5">
      <circle r="13" fill="#ffffff" stroke="#cdd8ea" stroke-width="2"/>
      <text class="ff num" x="0" y="4" text-anchor="middle">6</text>
    </g>
  </g>
  <text class="ff lbl todo fade lbl5" x="720" y="186" text-anchor="middle">Basis Data</text>

  <g transform="translate(840,132)">
    <g class="pop d6">
      <circle r="13" fill="#ffffff" stroke="#cdd8ea" stroke-width="2"/>
      <text class="ff num" x="0" y="4" text-anchor="middle">7</text>
    </g>
  </g>
  <text class="ff lbl todo fade lbl6" x="840" y="176" text-anchor="middle">Unggah</text>
  <text class="ff lbl todo fade lbl6" x="840" y="193" text-anchor="middle">Bukti Bayar</text>

  <g transform="translate(960,132)">
    <g class="pop d7">
      <circle r="13" fill="#ffffff" stroke="#cdd8ea" stroke-width="2"/>
      <text class="ff num" x="0" y="4" text-anchor="middle">8</text>
    </g>
  </g>
  <text class="ff lbl todo fade lbl7" x="960" y="186" text-anchor="middle">Ekspor Laporan</text>

  <g transform="translate(1080,132)">
    <g class="pop d8">
      <circle r="13" fill="#ffffff" stroke="#cdd8ea" stroke-width="2"/>
      <text class="ff num" x="0" y="4" text-anchor="middle">9</text>
    </g>
  </g>
  <text class="ff lbl todo fade lbl8" x="1080" y="176" text-anchor="middle">Notifikasi</text>
  <text class="ff lbl todo fade lbl8" x="1080" y="193" text-anchor="middle">Jatuh Tempo</text>
</svg>
